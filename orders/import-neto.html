// ── פונקציית התאמה לפי שם ────────────────────────────────────────────────────
function normN(s){
  return String(s||'')
    .replace(/^\d+\s*[-–—.]\s*/,'')   // הסרת קוד מוביל כמו "45828 - "
    .replace(/[()[\]'".,]/g,' ')       // פסיקים וסוגריים → רווח
    .replace(/\s+/g,' ')
    .trim()
    .toLowerCase();
}
function findEntry(productName){
  const pn = normN(productName);
  for(const entry of NETO_DATA){
    for(const pat of entry.names){
      const ep = normN(pat);
      if(pn === ep || pn.includes(ep) || (pn.length >= 4 && ep.includes(pn))) return entry;
    }
  }
  return null;
}

async function loadNeto(){
  const snap = await getDocs(collection(db,'products'));
  return snap.docs.filter(d=>d.data().supplierCode==='4557');
}

// ── 1. עדכן קוד + קטגוריה (הכי חשוב) ─────────────────────────────────────────
window.updateCodeAndCat = async function(){
  const btn = document.getElementById('btn-update');
  const log = document.getElementById('log');
  btn.disabled = true;
  log.innerHTML = '<b>טוען מוצרים...</b><br>';
  const neto = await loadNeto();
  log.innerHTML += `נמצאו ${neto.length} מוצרי נטו<br><br>`;

  let updated=0, noMatch=0;
  for(const d of neto){
    const {name='', barcode:curBC=''} = d.data();
    const entry = findEntry(name);
    if(!entry){
      log.innerHTML += `<span class="err">❓ לא נמצא: ${name}</span><br>`;
      noMatch++; log.scrollTop=log.scrollHeight; continue;
    }
    const updates = {category: entry.cat};
    if(entry.code && entry.code !== '0') updates.barcode = entry.code;
    await updateDoc(d.ref, updates);
    const icon = entry.cat==='frozen'?'❄️':entry.cat==='chilled'?'🧊':'📦';
    log.innerHTML += `<span class="ok">✅ ${icon} ${name} → קוד: ${entry.code||'—'}</span><br>`;
    updated++; log.scrollTop=log.scrollHeight;
  }
  log.innerHTML += `<br><strong style="color:#F0F4F8;">✅ עודכנו: ${updated} | לא נמצאו: ${noMatch}</strong>`;
  btn.textContent = '✅ הסתיים';
};

// ── 2. הוסף מוצרים חסרים (קיים בNETO_DATA אך לא בFirestore) ─────────────────
window.addMissingProducts = async function(){
  const btn = document.getElementById('btn-add-missing');
  const log = document.getElementById('log');
  btn.disabled = true;
  log.innerHTML = '<b>בודק מוצרים חסרים...</b><br>';

  const neto = await loadNeto();
  const netoData = neto.map(d => d.data());

  const missing = [];
  for(const entry of NETO_DATA){
    if(!entry.code) continue;
    const hasMatch = netoData.some(p => findEntry(p.name) === entry);
    if(!hasMatch) missing.push(entry);
  }

  if(missing.length === 0){
    log.innerHTML += '<span class="ok">✅ כל המוצרים קיימים בFirestore!</span>';
    btn.disabled = false; btn.textContent = '➕ הוסף מוצרים חסרים'; return;
  }

  log.innerHTML += `נמצאו <b>${missing.length}</b> מוצרים חסרים:<br><br>`;
  for(const e of missing){
    const icon = e.cat==='frozen'?'❄️':e.cat==='chilled'?'🧊':'📦';
    log.innerHTML += `<span class="warn">${icon} ${e.names[0]} (${e.code})</span><br>`;
  }

  if(!confirm(`להוסיף ${missing.length} מוצרים לFirestore?`)){ btn.disabled=false; return; }

  for(const e of missing){
    await addDoc(collection(db,'products'),{
      name: e.names[0],
      supplierCode: '4557',
      barcode: e.code,
      category: e.cat,
    });
    const icon = e.cat==='frozen'?'❄️':e.cat==='chilled'?'🧊':'📦';
    log.innerHTML += `<span class="ok">✅ ${icon} נוסף: ${e.names[0]}</span><br>`;
    log.scrollTop = log.scrollHeight;
  }
  log.innerHTML += `<br><strong style="color:#F0F4F8;">✅ נוספו ${missing.length} מוצרים</strong>`;
  btn.textContent = '✅ הסתיים';
};

// ── 3. הוסף קוד לשמות (אם ברקוד 4-6 ספרות) ──────────────────────────────────
window.startRename = async function(){
  const btn = document.getElementById('btn-rename');
  const log = document.getElementById('log');
  btn.disabled = true;
  log.innerHTML = '<b>טוען...</b><br>';
  const neto = await loadNeto();
  let updated=0, skipped=0, noCode=0;
  for(const d of neto){
    const {name='', barcode=''} = d.data();
    if(/^\d{4,6}\s*[-–]/.test(name)){ skipped++;
      log.innerHTML+=`<span class="skip">⏭ כבר יש קוד: ${name}</span><br>`; continue; }
    const bc = String(barcode);
    if(/^\d{4,6}$/.test(bc)){
      const newName = `${bc} - ${name}`;
      await updateDoc(d.ref,{name:newName});
      log.innerHTML+=`<span class="ok">✅ ${name} → ${newName}</span><br>`; updated++;
    } else {
      log.innerHTML+=`<span class="err">❓ אין קוד: ${name} (${bc||'ריק'})</span><br>`; noCode++;
    }
    log.scrollTop=log.scrollHeight;
  }
  log.innerHTML+=`<br><strong style="color:#F0F4F8;">עודכנו: ${updated} | כבר: ${skipped} | ללא קוד: ${noCode}</strong>`;
  btn.textContent='✅ הסתיים';
};

// ── 3. מיזוג כפילויות לפי שם ────────────────────────────────────────────────
window.mergeDupes = async function(){
  if(!confirm('למזג מוצרים עם שם זהה?')) return;
  const btn=document.getElementById('btn-merge'), log=document.getElementById('log');
  btn.disabled=true; log.innerHTML='<b>מנתח...</b><br>';
  const neto = await loadNeto();
  const byName={};
  for(const d of neto){
    const key=normN(d.data().name||'');
    if(!byName[key]) byName[key]=[];
    byName[key].push(d);
  }
  let merged=0;
  for(const [,docs] of Object.entries(byName)){
    if(docs.length<2) continue;
    docs.sort((a,b)=>Object.values(b.data()).filter(v=>v!=null&&v!=='').length
                    -Object.values(a.data()).filter(v=>v!=null&&v!=='').length);
    log.innerHTML+=`<span class="warn">🔀 שומר: ${docs[0].data().name}</span><br>`;
    for(const d of docs.slice(1)){
      await deleteDoc(d.ref);
      log.innerHTML+=`<span class="err">&nbsp;🗑 ${d.data().name}</span><br>`; merged++;
    }
    log.scrollTop=log.scrollHeight;
  }
  log.innerHTML+=`<br><strong>נמחקו ${merged} כפילויות</strong>${merged===0?'<br><span class="skip">לא נמצאו</span>':''}`;
  btn.textContent='✅ הסתיים';
};

// ── 4. מחק neto_ ────────────────────────────────────────────────────────────
window.deleteDupes = async function(){
  if(!confirm('למחוק את כל מוצרי neto_?')) return;
  const btn=document.getElementById('btn-del'), log=document.getElementById('log');
  btn.disabled=true;
  const snap=await getDocs(collection(db,'products'));
  const toDel=snap.docs.filter(d=>d.id.startsWith('neto_'));
  log.innerHTML+=`<br>מוחק ${toDel.length}...<br>`;
  for(const d of toDel){ await deleteDoc(d.ref);
    log.innerHTML+=`<span class="err">🗑 ${d.data().name}</span><br>`; log.scrollTop=log.scrollHeight; }
  log.innerHTML+=`<strong>✅ נמחקו ${toDel.length}</strong>`;
  btn.textContent='✅ הסתיים';
};
